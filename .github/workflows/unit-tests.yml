name: Unit Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # base: no torch or HIPPYNN. hippynn: the common ML stack.
        # engines: optional sampler dependencies, including their CPU import checks.
        # GPU4PySCF tests use fakes in every CPU job; no additional CUDA,
        # GPU4PySCF, CuPy or cuTENSOR install is needed for those tests.
        # Real CPP/PCM GPU qualification and its native-cuTENSOR guard live
        # in external alf_validation.
        dependencies: [base, hippynn, engines]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.dependencies }}" in
            hippynn)
              python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
              python -m pip install ".[tests,full]" "hippynn[full]"
              ;;
            engines)
              # ALCHEMI pulls in torchvision, whose PyPI build doesn't work with CPU-only torch.
              python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
              python -m pip install ".[tests,full,topology,torchsim,alchemi]" "hippynn[full]" \
                "git+https://github.com/lanl/PYSEQM@52850b4"
              ;;
            *)
              python -m pip install ".[tests]"
              ;;
          esac
          python -m pip check

      # Optional tests skip when a package is missing, so without this check a
      # broken install would look like a passing job.
      - name: Confirm every optional engine is usable
        if: matrix.dependencies == 'engines'
        run: |
          python - <<'EOF'
          from importlib.metadata import version

          import rdkit
          import seqm.ElectronicStructure
          import torch_sim
          import torchvision
          from alframework.samplers.alchemi_engine import SUPPORTED_VERSIONS

          installed = version('nvalchemi-toolkit')
          assert installed in SUPPORTED_VERSIONS, f'ALCHEMI {installed} is not in {SUPPORTED_VERSIONS}'
          EOF

      - name: Run pytest
        run: python -m pytest
