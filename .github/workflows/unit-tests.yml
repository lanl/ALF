name: Unit Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [base, hippynn]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dependencies }}" = "hippynn" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install ".[tests,full]" "hippynn[full]"
          else
            python -m pip install ".[tests]"
          fi
          python -m pip check

      - name: Run pytest
        run: python -m pytest
