[pytest]
addopts = -v -ra --strict-markers
pythonpath = .
testpaths = tests
filterwarnings =
    # ASE triggers this on nearly every step, burying other warnings in the CI log.
    ignore:Setting the shape on a NumPy array:DeprecationWarning:ase\.
markers =
    slow: a test that starts several processes importing PyTorch and HIPPYNN, or a real coordinator (tens of
        seconds each). CI runs them; `pytest -m "not slow"` skips them for a quick local run.
